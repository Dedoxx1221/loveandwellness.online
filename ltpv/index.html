<script>
(() => {
  const pages = [
    "https://loveandwellness.online/lead1",
    "https://loveandwellness.online/lead2",
    "https://loveandwellness.online/lead3"
  ];

  let index = localStorage.getItem("ab_index");

  if (index === null) {
    index = 0;
  } else {
    index = parseInt(index) + 1;
  }

  if (index >= pages.length) index = 0;

  localStorage.setItem("ab_index", index);

  window.location.replace(pages[index] + window.location.search + window.location.hash);
})();
</script>
